<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Domi Reversi - One Piece Casus Oyunu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f59e0b;
      --accent2: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    #ui > * { pointer-events: auto; }
    .container { width: 100%; max-width: 480px; }
    h1 {
      text-align: center;
      font-size: 1.7rem;
      margin-bottom: 2px;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(245, 158, 11, 0.45);
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 18px;
    }
    .card {
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    input, button, textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 9px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.12s, opacity 0.12s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button.success { background: var(--success); color: #000; }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--accent2); color: #fff; }
    .player-list, .room-list { list-style: none; margin: 10px 0; }
    .player-list li, .room-list li {
      padding: 9px 12px;
      background: #0f172a;
      border-radius: 9px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .player-list li.host::after {
      content: "HOST";
      font-size: 0.68rem;
      background: var(--accent);
      color: #000;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 700;
    }
    .room-list li { cursor: pointer; transition: background 0.12s; }
    .room-list li:hover { background: #1e293b; border: 1px solid var(--accent); }
    .room-code { font-weight: 700; color: var(--accent); }
    .room-meta { font-size: 0.78rem; color: var(--muted); }
    .role-box {
      background: #0f172a;
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin: 10px 0;
    }
    .role-box.spy { border-color: var(--accent2); }
    .role-box h2 { font-size: 1.3rem; margin-bottom: 4px; }
    .notes { height: 110px; resize: vertical; }
    .vote-counter {
      text-align: center;
      font-size: 1.05rem;
      margin: 8px 0;
      color: var(--accent);
      font-weight: 700;
    }
    .hidden { display: none !important; }
    .status { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 6px; }
    .result-box {
      text-align: center;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .result-box.win { background: rgba(34,197,94,0.2); border: 2px solid var(--success); }
    .result-box.lose { background: rgba(239,68,68,0.2); border: 2px solid var(--accent2); }
    .vote-options button { margin-bottom: 7px; background: #334155; color: var(--text); }
    .vote-options button:hover { background: var(--accent); color: #000; }
    .small { font-size: 0.82rem; color: var(--muted); }
    .section-title { font-size: 0.9rem; font-weight: 600; margin: 14px 0 6px; color: var(--muted); }
    .empty-rooms { text-align: center; color: var(--muted); padding: 16px; font-size: 0.88rem; }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    #canvas-container canvas { display: block; width: 100%; height: 100%; }
    #controls-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.75);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container" class="hidden"></div>
  <div id="controls-hint" class="hidden">WASD hareket • Space zıpla • Tıkla + mouse bak</div>

  <div id="ui">
    <div class="container">
      <h1>Domi Reversi</h1>
      <p class="subtitle">One Piece Casus Oyunu</p>

      <div id="lobby" class="card">
        <input id="playerName" placeholder="İsminizi yazın" maxlength="16" />
        <button id="btnCreate" class="success">Yeni Oda Oluştur</button>

        <div class="section-title">Aktif Odalar</div>
        <ul class="room-list" id="roomList">
          <li class="empty-rooms">Odalar yükleniyor...</li>
        </ul>

        <div class="section-title">veya kod ile katıl</div>
        <div style="display:flex; gap:8px;">
          <input id="roomCodeInput" placeholder="Oda Kodu" maxlength="6" style="text-transform:uppercase; flex:1; margin-bottom:0;" />
          <button id="btnJoinCode" class="secondary" style="width:auto; min-width:90px; margin-bottom:0;">Katıl</button>
        </div>
        <p class="status" id="lobbyStatus"></p>
      </div>

      <div id="room" class="card hidden" style="max-width:320px; margin-left:auto; margin-right:0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div>
            <strong>Oda:</strong> <span id="roomCodeDisplay" style="color:var(--accent); font-size:1.2rem;"></span>
          </div>
          <button id="btnLeave" class="secondary" style="width:auto; padding:5px 10px; font-size:0.8rem; margin:0;">Ayrıl</button>
        </div>
        <p class="small">Oyuncular (3-8):</p>
        <ul class="player-list" id="playerList"></ul>
        <button id="btnStart" class="success hidden">Oyunu Başlat</button>
        <p class="status" id="roomStatus">Adada gezinin, host başlatınca oyun başlar.</p>
      </div>

      <div id="game" class="card hidden">
        <div id="roleBox" class="role-box">
          <p class="small">Senin bilgin:</p>
          <h2 id="roleText">...</h2>
          <p id="roleSub" class="small"></p>
        </div>
        <label class="small">Not Defteri</label>
        <textarea id="notes" class="notes" placeholder="Şüpheli kişiler, ipuçları..."></textarea>
        <div class="vote-counter" id="voteCounter">Oylama Başlat: 0 / ?</div>
        <button id="btnVoteStart">Oylama Başlat</button>
        <div id="votingArea" class="hidden">
          <p style="margin:10px 0 6px; font-weight:600;">Casus kim?</p>
          <div class="vote-options" id="voteOptions"></div>
        </div>
        <div id="resultArea" class="hidden"></div>
        <button id="btnNewRound" class="success hidden" style="margin-top:10px;">Yeni Tur</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tssumggdsbcjdhmfphlg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Y60SRvr2Q2_Bb7Sa1gaVw_b0PM6o-J';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CHARACTERS = [
      "Monkey D. Luffy","Roronoa Zoro","Nami","Usopp","Sanji","Tony Tony Chopper","Nico Robin","Franky","Brook","Jinbe",
      "Portgas D. Ace","Sabo","Shanks","Buggy","Dracule Mihawk","Boa Hancock","Trafalgar Law","Eustass Kid","Killer","X Drake",
      "Basil Hawkins","Jewelry Bonney","Capone Bege","Scratchmen Apoo","Urouge","Marshall D. Teach","Shiryu","Jesus Burgess",
      "Edward Newgate","Marco","Vista","Jozu","Kaido","King","Queen","Jack","Yamato",
      "Charlotte Linlin","Charlotte Katakuri","Charlotte Smoothie","Charlotte Cracker","Charlotte Perospero",
      "Donquixote Doflamingo","Trebol","Diamante","Pica","Vergo","Sugar","Crocodile","Daz Bones","Bentham",
      "Monkey D. Garp","Sengoku","Sakazuki","Borsalino","Kuzan","Issho","Rob Lucci","Kaku",
      "Silvers Rayleigh","Gol D. Roger","Kozuki Oden","Kozuki Momonosuke","Kin'emon","Kikunojo",
      "Inuarashi","Nekomamushi","Carrot","Vivi","Enel","Arlong","Bartholomew Kuma","Gecko Moria","Perona",
      "Hody Jones","Shirahoshi","Fisher Tiger"
    ];

    const GENERAL_INFOS = [
      "Devil Fruit kullanıcısı","Haki kullanabiliyor","Ödülü var (bounty sahibi)",
      "Erkek ve kılıç kullanıyor","Kadın karakter","Denizci (Marine)","Korsan (Pirate)",
      "Hasır Şapka ile bağlantılı","Yonko veya eski Yonko mürettebatı","Shichibukai / eski Warlord",
      "Supernova / Worst Generation","Wano ile bağlantılı","Balıkadam veya deniz ırkı",
      "Devil Fruit yok","Logia tipi Devil Fruit","Paramecia tipi Devil Fruit","Zoan tipi Devil Fruit",
      "Amiral veya eski amiral","Devrimci Ordu üyesi"
    ];

    let lobbyChannel = null, gameChannel = null;
    let myId = crypto.randomUUID(), myName = '', roomCode = '', isHost = false;
    let players = {}, gameState = 'lobby', spyId = null;
    let voteStartCount = 0, votedPlayers = new Set(), myVote = null, votes = {};
    let activeRooms = {};

    // 3D
    let scene, camera, renderer, clock, localPlayer;
    let remotePlayers = {};
    let keys = {}, velocityY = 0, canJump = true, lastPosSend = 0;
    let yaw = 0, pitch = 0;
    const GRAVITY = -25, JUMP_FORCE = 10, SPEED = 8, ISLAND_RADIUS = 18;

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }
    function majorityNeeded(n) { return Math.floor(n / 2) + 1; }
    function show(id) {
      ['lobby','room','game'].forEach(s => document.getElementById(s).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function init3D() {
      const container = document.getElementById('canvas-container');
      container.classList.remove('hidden');
      document.getElementById('controls-hint').classList.remove('hidden');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 25, 60);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 6, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      const ambient = new THREE.AmbientLight(0xffffff, 0.55);
      scene.add(ambient);
      const sun = new THREE.DirectionalLight(0xfff0dd, 1.1);
      sun.position.set(20, 30, 10);
      sun.castShadow = true;
      scene.add(sun);

      // Water
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(120, 120),
        new THREE.MeshStandardMaterial({ color: 0x1e90ff, transparent: true, opacity: 0.85, roughness: 0.3 })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = -0.3;
      scene.add(water);

      // Island
      const island = new THREE.Mesh(
        new THREE.CircleGeometry(ISLAND_RADIUS, 48),
        new THREE.MeshStandardMaterial({ color: 0xe8c07a, roughness: 0.9 })
      );
      island.rotation.x = -Math.PI / 2;
      island.position.y = 0.01;
      island.receiveShadow = true;
      scene.add(island);

      // Rocks
      for (let i = 0; i < 8; i++) {
        const r = 4 + Math.random() * 10;
        const a = Math.random() * Math.PI * 2;
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.6 + Math.random() * 1.2, 0),
          new THREE.MeshStandardMaterial({ color: 0x8b7355 })
        );
        rock.position.set(Math.cos(a)*r, 0.4, Math.sin(a)*r);
        rock.castShadow = true;
        scene.add(rock);
      }

      // Simple palms
      for (let i = 0; i < 5; i++) {
        const r = 6 + Math.random() * 8;
        const a = Math.random() * Math.PI * 2;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.15, 0.25, 2.2, 6),
          new THREE.MeshStandardMaterial({ color: 0x6b4226 })
        );
        trunk.position.set(Math.cos(a)*r, 1.1, Math.sin(a)*r);
        trunk.castShadow = true;
        scene.add(trunk);
        const leaves = new THREE.Mesh(
          new THREE.ConeGeometry(1.4, 2, 6),
          new THREE.MeshStandardMaterial({ color: 0x2e8b57 })
        );
        leaves.position.set(Math.cos(a)*r, 2.8, Math.sin(a)*r);
        leaves.castShadow = true;
        scene.add(leaves);
      }

      localPlayer = createAvatar(0xf59e0b);
      localPlayer.position.set(0, 1, 0);
      scene.add(localPlayer);

      window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
      window.addEventListener('keyup', e => { keys[e.code] = false; });
      window.addEventListener('resize', onResize);
      renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
      document.addEventListener('mousemove', onMouseMove);

      animate();
    }

    function onMouseMove(e) {
      if (document.pointerLockElement !== renderer?.domElement) return;
      yaw -= e.movementX * 0.002;
      pitch = Math.max(-1.2, Math.min(1.2, pitch - e.movementY * 0.002));
    }

    function createAvatar(color) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.35, 0.7, 4, 8),
        new THREE.MeshStandardMaterial({ color })
      );
      body.position.y = 0.9;
      body.castShadow = true;
      group.add(body);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xffdbac })
      );
      head.position.y = 1.7;
      head.castShadow = true;
      group.add(head);
      return group;
    }

    function onResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      if (!renderer) return;
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (localPlayer && gameState === 'room') {
        const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        let move = new THREE.Vector3();
        if (keys['KeyW']) move.add(forward);
        if (keys['KeyS']) move.sub(forward);
        if (keys['KeyA']) move.sub(right);
        if (keys['KeyD']) move.add(right);
        if (move.length() > 0) {
          move.normalize().multiplyScalar(SPEED * dt);
          localPlayer.position.add(move);
        }

        velocityY += GRAVITY * dt;
        localPlayer.position.y += velocityY * dt;
        if (localPlayer.position.y <= 1) {
          localPlayer.position.y = 1;
          velocityY = 0;
          canJump = true;
        }
        if (keys['Space'] && canJump) {
          velocityY = JUMP_FORCE;
          canJump = false;
        }

        const dist = Math.sqrt(localPlayer.position.x**2 + localPlayer.position.z**2);
        if (dist > ISLAND_RADIUS - 0.8) {
          const scale = (ISLAND_RADIUS - 0.8) / dist;
          localPlayer.position.x *= scale;
          localPlayer.position.z *= scale;
        }

        const camOffset = new THREE.Vector3(Math.sin(yaw)*6, 3.5 + pitch*2, Math.cos(yaw)*6);
        camera.position.lerp(localPlayer.position.clone().add(camOffset), 0.15);
        camera.lookAt(localPlayer.position.x, localPlayer.position.y + 1.2, localPlayer.position.z);

        const now = performance.now();
        if (now - lastPosSend > 80) {
          lastPosSend = now;
          broadcast('pos', { x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, yaw });
        }
      }

      Object.values(remotePlayers).forEach(rp => {
        if (rp.target) rp.mesh.position.lerp(rp.target, 0.2);
      });

      renderer.render(scene, camera);
    }

    function destroy3D() {
      document.getElementById('canvas-container').classList.add('hidden');
      document.getElementById('controls-hint').classList.add('hidden');
      if (renderer) {
        renderer.dispose();
        document.getElementById('canvas-container').innerHTML = '';
      }
      scene = camera = renderer = localPlayer = null;
      remotePlayers = {};
      if (document.pointerLockElement) document.exitPointerLock();
    }

    function addRemotePlayer(id, name, color) {
      if (remotePlayers[id] || !scene) return;
      const mesh = createAvatar(color || 0x60a5fa);
      mesh.position.set(Math.random()*4-2, 1, Math.random()*4-2);
      scene.add(mesh);
      remotePlayers[id] = { mesh, name, target: mesh.position.clone() };
    }

    function removeRemotePlayer(id) {
      if (!remotePlayers[id]) return;
      scene.remove(remotePlayers[id].mesh);
      delete remotePlayers[id];
    }

    function broadcast(event, payload) {
      if (!gameChannel) return;
      gameChannel.send({ type: 'broadcast', event, payload: { ...payload, from: myId } });
    }

    function updatePlayerList() {
      const ul = document.getElementById('playerList');
      ul.innerHTML = '';
      const ids = Object.keys(players);
      ids.forEach(id => {
        const p = players[id];
        const li = document.createElement('li');
        li.textContent = p.name + (id === myId ? ' (Sen)' : '');
        if (p.isHost) li.classList.add('host');
        ul.appendChild(li);
      });
      const btnStart = document.getElementById('btnStart');
      if (isHost && ids.length >= 3 && ids.length <= 8) btnStart.classList.remove('hidden');
      else btnStart.classList.add('hidden');
      document.getElementById('roomStatus').textContent =
        ids.length < 3 ? `En az 3 kişi gerekli (${ids.length}/3)` :
        ids.length > 8 ? 'Maksimum 8 kişi!' : 'Adada gezinin, host başlatabilir.';

      if (isHost && lobbyChannel) {
        lobbyChannel.track({ id: myId, name: myName, roomCode, playerCount: ids.length, isHost: true });
      }
    }

    function updateRoomList() {
      const ul = document.getElementById('roomList');
      const codes = Object.keys(activeRooms);
      if (codes.length === 0) {
        ul.innerHTML = '<li class="empty-rooms">Şu an aktif oda yok.<br>Bir tane oluştur!</li>';
        return;
      }
      ul.innerHTML = '';
      codes.forEach(code => {
        const r = activeRooms[code];
        const li = document.createElement('li');
        li.innerHTML = `<div><div class="room-code">${code}</div><div class="room-meta">${r.hostName} • ${r.playerCount} oyuncu</div></div>
          <button class="secondary" style="width:auto;padding:5px 10px;margin:0;font-size:0.8rem;">Katıl</button>`;
        li.onclick = () => joinRoom(code);
        ul.appendChild(li);
      });
    }

    async function initLobby() {
      lobbyChannel = supabaseClient.channel('domi:lobby', { config: { presence: { key: myId } } });
      lobbyChannel.on('presence', { event: 'sync' }, () => {
        const state = lobbyChannel.presenceState();
        activeRooms = {};
        Object.values(state).forEach(arr => {
          arr.forEach(p => {
            if (p.roomCode && p.isHost) {
              activeRooms[p.roomCode] = { hostName: p.name, playerCount: p.playerCount || 1, hostId: p.id };
            }
          });
        });
        updateRoomList();
      }).subscribe();
    }

    async function joinRoom(code, asHost = false) {
      myName = document.getElementById('playerName').value.trim();
      if (!myName) { alert('Önce ismini yaz!'); return; }

      roomCode = code.toUpperCase();
      isHost = asHost;
      if (gameChannel) await gameChannel.unsubscribe();

      gameChannel = supabaseClient.channel(`domi:room:${roomCode}`, {
        config: { presence: { key: myId }, broadcast: { self: true } }
      });

      gameChannel
        .on('presence', { event: 'sync' }, () => {
          const state = gameChannel.presenceState();
          const newPlayers = {};
          Object.values(state).forEach(arr => {
            arr.forEach(p => { newPlayers[p.id] = { name: p.name, isHost: p.isHost }; });
          });
          Object.keys(newPlayers).forEach(id => {
            if (id !== myId && !remotePlayers[id] && scene) {
              const colors = [0x60a5fa, 0x34d399, 0xf472b6, 0xa78bfa, 0xfbbf24, 0x22d3ee];
              addRemotePlayer(id, newPlayers[id].name, colors[Object.keys(remotePlayers).length % colors.length]);
            }
          });
          Object.keys(remotePlayers).forEach(id => {
            if (!newPlayers[id]) removeRemotePlayer(id);
          });
          players = newPlayers;
          updatePlayerList();
        })
        .on('broadcast', { event: 'pos' }, ({ payload }) => {
          if (payload.from === myId || !remotePlayers[payload.from]) return;
          const rp = remotePlayers[payload.from];
          rp.target = new THREE.Vector3(payload.x, payload.y, payload.z);
          rp.mesh.rotation.y = payload.yaw || 0;
        })
        .on('broadcast', { event: 'game_start' }, ({ payload }) => handleGameStart(payload))
        .on('broadcast', { event: 'vote_start_press' }, ({ payload }) => handleVoteStartPress(payload))
        .on('broadcast', { event: 'vote_cast' }, ({ payload }) => handleVoteCast(payload))
        .on('broadcast', { event: 'new_round' }, () => { resetToRoom(); })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await gameChannel.track({ id: myId, name: myName, isHost });
            if (isHost && lobbyChannel) {
              await lobbyChannel.track({ id: myId, name: myName, roomCode, playerCount: 1, isHost: true });
            }
            document.getElementById('roomCodeDisplay').textContent = roomCode;
            show('room');
            init3D();
          }
        });
    }

    function handleGameStart(payload) {
      destroy3D();
      spyId = payload.spyId;
      voteStartCount = 0; votedPlayers = new Set(); votes = {}; myVote = null;

      const isSpy = myId === spyId;
      const roleBox = document.getElementById('roleBox');
      if (isSpy) {
        roleBox.classList.add('spy');
        document.getElementById('roleText').textContent = payload.generalInfo;
        document.getElementById('roleSub').textContent = 'Sen CASUSSUN! Bu genel bilgiyle uydur.';
      } else {
        roleBox.classList.remove('spy');
        document.getElementById('roleText').textContent = payload.character;
        document.getElementById('roleSub').textContent = 'Herkes aynı karakteri biliyor. Casusu bul!';
      }

      document.getElementById('notes').value = '';
      document.getElementById('votingArea').classList.add('hidden');
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('btnNewRound').classList.add('hidden');
      document.getElementById('btnVoteStart').disabled = false;
      document.getElementById('btnVoteStart').textContent = 'Oylama Başlat';
      document.getElementById('voteCounter').textContent = `Oylama Başlat: 0 / ${majorityNeeded(Object.keys(players).length)}`;
      show('game');
      gameState = 'game';
    }

    function handleVoteStartPress(payload) {
      if (gameState !== 'game') return;
      votedPlayers.add(payload.from);
      voteStartCount = votedPlayers.size;
      const needed = majorityNeeded(Object.keys(players).length);
      document.getElementById('voteCounter').textContent = `Oylama Başlat: ${voteStartCount} / ${needed}`;
      if (voteStartCount >= needed) startVoting();
    }

    function startVoting() {
      gameState = 'voting';
      document.getElementById('btnVoteStart').disabled = true;
      document.getElementById('btnVoteStart').textContent = 'Oylama başladı!';
      document.getElementById('votingArea').classList.remove('hidden');
      const opts = document.getElementById('voteOptions');
      opts.innerHTML = '';
      Object.entries(players).forEach(([id, p]) => {
        if (id === myId) return;
        const btn = document.createElement('button');
        btn.textContent = p.name;
        btn.onclick = () => castVote(id);
        opts.appendChild(btn);
      });
    }

    function castVote(targetId) {
      if (myVote) return;
      myVote = targetId;
      broadcast('vote_cast', { targetId });
      document.querySelectorAll('#voteOptions button').forEach(b => b.disabled = true);
    }

    function handleVoteCast(payload) {
      votes[payload.from] = payload.targetId;
      if (Object.keys(votes).length >= Object.keys(players).length) revealResult();
    }

    function revealResult() {
      gameState = 'result';
      const tally = {};
      Object.values(votes).forEach(tid => { tally[tid] = (tally[tid] || 0) + 1; });
      let max = 0, winner = null;
      Object.entries(tally).forEach(([id, c]) => { if (c > max) { max = c; winner = id; } });

      const resultArea = document.getElementById('resultArea');
      resultArea.classList.remove('hidden');
      if (winner === spyId) {
        resultArea.innerHTML = `<div class="result-box win">Casus doğru bulundu!<br><span class="small">${players[spyId]?.name || 'Casus'} yakalandı.</span></div>`;
      } else {
        resultArea.innerHTML = `<div class="result-box lose">Kaybettiniz!<br><span class="small">Casus: ${players[spyId]?.name || 'Bilinmiyor'}</span></div>`;
      }
      document.getElementById('btnNewRound').classList.remove('hidden');
      document.getElementById('btnNewRound').disabled = !isHost;
    }

    function resetToRoom() {
      gameState = 'room';
      show('room');
      init3D();
      document.getElementById('roomStatus').textContent = 'Yeni tur için host başlatabilir.';
    }

    document.getElementById('btnCreate').onclick = async () => {
      myName = document.getElementById('playerName').value.trim();
      if (!myName) { alert('İsim girin'); return; }
      document.getElementById('lobbyStatus').textContent = 'Oda oluşturuluyor...';
      await joinRoom(generateRoomCode(), true);
    };
    document.getElementById('btnJoinCode').onclick = async () => {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) { alert('Oda kodu girin'); return; }
      document.getElementById('lobbyStatus').textContent = 'Katılıyor...';
      await joinRoom(code, false);
    };
    document.getElementById('btnLeave').onclick = async () => {
      destroy3D();
      if (gameChannel) await gameChannel.unsubscribe();
      if (isHost && lobbyChannel) await lobbyChannel.track({ id: myId, name: myName, isHost: false });
      gameChannel = null; players = {}; isHost = false; roomCode = '';
      show('lobby');
    };
    document.getElementById('btnStart').onclick = () => {
      if (!isHost) return;
      const ids = Object.keys(players);
      if (ids.length < 3 || ids.length > 8) return;
      const character = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
      const spyIdChosen = ids[Math.floor(Math.random() * ids.length)];
      const generalInfo = GENERAL_INFOS[Math.floor(Math.random() * GENERAL_INFOS.length)];
      broadcast('game_start', { character, spyId: spyIdChosen, generalInfo });
    };
    document.getElementById('btnVoteStart').onclick = () => {
      if (gameState !== 'game') return;
      broadcast('vote_start_press', {});
    };
    document.getElementById('btnNewRound').onclick = () => {
      if (!isHost) return;
      broadcast('new_round', {});
    };

    initLobby();
  </script>
</body>
</html>
