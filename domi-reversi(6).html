<html lang="tr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domi Reversi - One Piece Oyunları</title>

    :root {
      --straw: #f5c542;
      --straw-dark: #d4a017;
      --sea: #1a6b9a;
      --pirate-red: #c41e3a;
      --text: #fff8e7;
      --muted: #c9b89a;
      --card-bg: rgba(20, 30, 48, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: #0a1628 url('onepiece-collage.png') center center / cover no-repeat fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 12px;
    }

    body.lobby-mode {
      background: url('onepiece-bg.png') center center / cover no-repeat fixed;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10,22,40,0.55) 0%, rgba(10,22,40,0.82) 100%);
      z-index: 0;
      pointer-events: none;
    }
    body.lobby-mode::before {
      background: linear-gradient(to bottom, rgba(10,22,40,0.5) 0%, rgba(10,22,40,0.78) 100%);
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Pirata One', cursive;
      text-align: center;
      font-size: 2.6rem;
      color: var(--straw);
      text-shadow: 3px 3px 0 #000, 0 0 20px rgba(245,197,66,0.5);
      margin-bottom: 2px;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 22px;
      text-shadow: 1px 1px 3px #000;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
      border: 2px solid var(--straw-dark);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 30px rgba(245,197,66,0.05);
    }

    input, button, textarea {
      width: 100%;
      padding: 13px 15px;
      border-radius: 10px;
      border: 2px solid #3a4a5c;
      background: rgba(10, 20, 35, 0.9);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 10px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--straw);
      box-shadow: 0 0 0 3px rgba(245,197,66,0.25);
    }
    input::placeholder { color: #7a8a9a; }

    button {
      background: linear-gradient(180deg, var(--straw) 0%, var(--straw-dark) 100%);
      color: #1a1200;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.15s, filter 0.15s;
      box-shadow: 0 4px 0 #9a7b12;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    button:active { transform: translateY(1px); box-shadow: 0 2px 0 #9a7b12; }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    button.success {
      background: linear-gradient(180deg, #3ecf6a 0%, #2a9d4a 100%);
      box-shadow: 0 4px 0 #1e7a35;
      color: #041a0c;
    }
    button.secondary {
      background: linear-gradient(180deg, #4a5a6c 0%, #2f3a48 100%);
      box-shadow: 0 4px 0 #1c2430;
      color: var(--text);
    }

    .player-list, .room-list { list-style: none; margin: 12px 0; }
    .player-list li, .room-list li {
      padding: 11px 14px;
      background: rgba(10,20,35,0.7);
      border-radius: 10px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border: 1px solid #2a3a4c;
    }
    .player-list li.host::after {
      content: "KAPTAN";
      font-size: 0.68rem;
      background: var(--straw);
      color: #1a1200;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }
    .room-list li { cursor: pointer; transition: all 0.15s; }
    .room-list li:hover {
      border-color: var(--straw);
      background: rgba(245,197,66,0.1);
    }
    .room-code { font-weight: 700; color: var(--straw); font-size: 1.15rem; }
    .room-meta { font-size: 0.8rem; color: var(--muted); }

    .role-box {
      background: rgba(10,20,35,0.8);
      border: 3px solid var(--straw);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin: 12px 0;
      position: relative;
    }
    .role-box.spy { border-color: var(--pirate-red); }
    .role-box h2 {
      font-family: 'Pirata One', cursive;
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: var(--straw);
    }
    .role-box.spy h2 { color: #ff6b6b; }

    .notes { height: 120px; resize: vertical; }
    .vote-counter {
      text-align: center;
      font-size: 1.1rem;
      margin: 10px 0;
      color: var(--straw);
      font-weight: 700;
    }
    .hidden { display: none !important; }
    .status { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .result-box {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .result-box.win {
      background: rgba(46, 160, 80, 0.25);
      border: 2px solid #3ecf6a;
    }
    .result-box.lose {
      background: rgba(192, 40, 40, 0.25);
      border: 2px solid #e04545;
    }
    .vote-options button {
      margin-bottom: 8px;
      background: linear-gradient(180deg, #3a4a5c 0%, #2a3545 100%);
      box-shadow: 0 3px 0 #1a2230;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
    }
    .vote-options button:hover {
      background: linear-gradient(180deg, var(--straw) 0%, var(--straw-dark) 100%);
      color: #1a1200;
    }
    .small { font-size: 0.85rem; color: var(--muted); }
    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 16px 0 8px;
      color: var(--straw);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .empty-rooms {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 0.9rem;
    }
    .wanted-label {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--straw-dark);
      color: #1a1200;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* Audio controls - top right */
    #audio-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 30, 48, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 30px;
      border: 1px solid var(--straw-dark);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    #audio-controls button {
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: none;
      background: rgba(245, 197, 66, 0.2);
      color: var(--straw);
      border: 1px solid var(--straw-dark);
      text-transform: none;
    }
    #audio-controls button:hover {
      background: var(--straw);
      color: #1a1200;
      transform: none;
    }
    #volume-slider {
      width: 80px;
      height: 6px;
      margin: 0;
      padding: 0;
      accent-color: var(--straw);
      cursor: pointer;
      background: transparent;
      border: none;
    }
    .mode-btn.active { background: var(--straw); color: #1a1200; border-color: var(--straw-dark); }
    .au-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .au-side { background: rgba(10,20,34,.7); border: 2px solid #345; border-radius: 12px; padding: 10px; }
    .au-side.me { border-color: var(--straw); }
    .au-side.turn { box-shadow: 0 0 0 3px var(--pirate-red); }
    .au-side h3 { font-size: 1rem; }
    .au-money { font-size: 1.6rem; color: var(--straw); font-weight: 700; }
    .au-slot { border: 1px dashed #567; border-radius: 6px; padding: 4px 6px; margin-top: 4px; font-size: .85rem; min-height: 26px; }
    .au-slot.f { border-style: solid; border-color: var(--straw-dark); background: rgba(245,197,66,.12); }
    .au-char { text-align: center; font-family: 'Pirata One', cursive; font-size: 2rem; color: var(--straw); margin: 6px 0; }
    .au-mid { text-align: center; color: var(--muted); }
    .au-row { display: flex; gap: 8px; }
    .au-row > * { flex: 1; }
    .au-log { font-size: .8rem; color: var(--muted); max-height: 130px; overflow: auto; margin-top: 12px; }
    .au-log div { padding: 2px 0; border-bottom: 1px solid #234; }
  </style>
</head>
<body class="lobby-mode">

  </div>

    <p class="subtitle">One Piece Oyunları</p>

    <div id="lobby" class="card">

      <div class="section-title" style="margin-top:0;">Oyun Modu</div>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button id="modeSpy" class="secondary mode-btn active" style="margin:0;">🕵️ Casusu Bul</button>
        <button id="modeAuc" class="secondary mode-btn" style="margin:0;">⚓ Nakama Müzayedesi</button>
      </div>
      <button id="btnCreate" class="success">Yeni Oda Oluştur</button>

      <div class="section-title">Aktif Odalar</div>

        <li class="empty-rooms">Şu an aktif oda yok.<br>Bir tane oluştur, nakamalarını çağır!</li>
      </ul>

      <div class="section-title">veya kod ile katıl</div>
      <div style="display:flex; gap:8px;">

        <button id="btnJoinCode" class="secondary" style="width:auto; min-width:90px; margin-bottom:0;">Katıl</button>

      <p class="status" id="lobbyStatus"></p>

    <div id="room" class="card hidden">

      <ul class="player-list" id="playerList"></ul>
      <button id="btnStart" class="success hidden">Oyunu Başlat</button>
      <p class="status" id="roomStatus">Kaptan oyunu başlatana kadar bekleyin...</p>
    </div>

    <div id="auction" class="card hidden">
      <div id="auView"></div>
    </div>

    <div id="game" class="card hidden">

        <div class="wanted-label" id="roleLabel">BİLGİ</div>

        <h2 id="roleText">...</h2>
        <p id="roleSub" class="small"></p>

      <label class="small">Not Defteri (sadece sen görürsün)</label>
      <textarea id="notes" class="notes" placeholder="Şüpheli nakamalar, ipuçları..."></textarea>

      <div class="vote-counter" id="voteCounter">Oylama Başlat: 0 / ?</div>
      <button id="btnVoteStart">Oylama Başlat</button>

        <p style="margin:12px 0 8px; font-weight:600; color:var(--straw);">Casus kim?</p>
        <div class="vote-options" id="voteOptions"></div>
      </div>

      <div id="resultArea" class="hidden"></div>
      <button id="btnNewRound" class="success hidden" style="margin-top:12px;">Yeni Tur</button>
    </div>

      const codes = Object.keys(activeRooms);
      if (codes.length === 0) {
        ul.innerHTML = '<li class="empty-rooms">Şu an aktif oda yok.<br>Bir tane oluştur, nakamalarını çağır!</li>';
        return;
      }
      ul.innerHTML = '';
      codes.forEach(code => {
        const r = activeRooms[code];
        const li = document.createElement('li');
        li.innerHTML = `<div><div class="room-code">${code}</div><div class="room-meta">${r.hostName} • ${r.playerCount} oyuncu • ${modeName(r.mode)}</div></div>
          <button class="secondary" style="width:auto;padding:6px 12px;margin:0;font-size:0.8rem;">Katıl</button>`;
        li.onclick = () => joinRoom(code);
        ul.appendChild(li);
      });
    }

    async function initLobby() {
      lobbyChannel = supabaseClient.channel('domi:lobby', { config: { presence: { key: myId } } });
      lobbyChannel.on('presence', { event: 'sync' }, () => {
        const state = lobbyChannel.presenceState();
        activeRooms = {};
        Object.values(state).forEach(arr => {
          arr.forEach(p => {
            if (p.roomCode && p.isHost) {
              activeRooms[p.roomCode] = { hostName: p.name, playerCount: p.playerCount || 1, hostId: p.id, mode: p.mode || 'spy' };
            }
          });
        });
        updateRoomList();
      }).subscribe();
    }

    async function joinRoom(code, asHost = false) {
      myName = document.getElementById('playerName').value.trim();
      if (!myName) { alert('Önce korsan adını yaz!'); return; }

      roomCode = code.toUpperCase();
      isHost = asHost;
      if (gameChannel) await gameChannel.unsubscribe();

      gameChannel = supabaseClient.channel(`domi:room:${roomCode}`, {
        config: { presence: { key: myId }, broadcast: { self: true } }
      });

      gameChannel
        .on('presence', { event: 'sync' }, () => {
          const state = gameChannel.presenceState();
          players = {};
          Object.values(state).forEach(arr => {
            arr.forEach(p => { players[p.id] = { name: p.name, isHost: p.isHost }; if (p.isHost && p.mode) mode = p.mode; });
          });
          updatePlayerList();
        })
        .on('broadcast', { event: 'game_start' }, ({ payload }) => handleGameStart(payload))
        .on('broadcast', { event: 'au_state' }, ({ payload }) => { if (isHost) return; AS = payload.AS; auRender(); })
        .on('broadcast', { event: 'au_act' }, ({ payload }) => { if (isHost && AS) { const p = AS.ids.indexOf(payload.from); if (p >= 0) auApply(p, payload.a); } })
        .on('broadcast', { event: 'au_need' }, () => { if (isHost && AS) auPush(); })
        .on('broadcast', { event: 'vote_start_press' }, ({ payload }) => handleVoteStartPress(payload))
        .on('broadcast', { event: 'vote_cast' }, ({ payload }) => handleVoteCast(payload))
        .on('broadcast', { event: 'new_round' }, () => {
          gameState = 'room';
          show('room');
          document.getElementById('roomStatus').textContent = 'Yeni tur için kaptan başlatabilir.';
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await gameChannel.track({ id: myId, name: myName, isHost, mode });
            if (!isHost) broadcast('au_need', {});
            if (isHost && lobbyChannel) {
              await lobbyChannel.track({ id: myId, name: myName, roomCode, playerCount: 1, isHost: true, mode });
            }
            document.getElementById('roomCodeDisplay').textContent = roomCode;
            show('room');
          }
        });
    }

    function handleGameStart(payload) {
      spyId = payload.spyId;
      voteStartCount = 0; votedPlayers = new Set(); votes = {}; myVote = null;

      const isSpy = myId === spyId;
      const roleBox = document.getElementById('roleBox');
      const roleLabel = document.getElementById('roleLabel');

      if (isSpy) {
        roleBox.classList.add('spy');
        roleLabel.textContent = 'CASUS';
        roleLabel.style.background = 'var(--pirate-red)';
        roleLabel.style.color = '#fff';
        document.getElementById('roleText').textContent = payload.generalInfo;
        document.getElementById('roleSub').textContent = 'Sen CASUSSUN! Bu genel bilgiyle uydur.';
      } else {
        roleBox.classList.remove('spy');
        roleLabel.textContent = 'KARAKTER';
        roleLabel.style.background = 'var(--straw-dark)';
        roleLabel.style.color = '#1a1200';
        document.getElementById('roleText').textContent = payload.character;
        document.getElementById('roleSub').textContent = 'Herkes aynı karakteri biliyor. Casusu bul!';
      }

      document.getElementById('notes').value = '';
      document.getElementById('votingArea').classList.add('hidden');
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('btnNewRound').classList.add('hidden');
      document.getElementById('btnVoteStart').disabled = false;
      document.getElementById('btnVoteStart').textContent = 'Oylama Başlat';
      document.getElementById('voteCounter').textContent = `Oylama Başlat: 0 / ${majorityNeeded(Object.keys(players).length)}`;
      show('game');
      gameState = 'game';
    }

    function handleVoteStartPress(payload) {
      if (gameState !== 'game') return;
      votedPlayers.add(payload.from);
      voteStartCount = votedPlayers.size;
      const needed = majorityNeeded(Object.keys(players).length);
      document.getElementById('voteCounter').textContent = `Oylama Başlat: ${voteStartCount} / ${needed}`;
      if (voteStartCount >= needed) startVoting();
    }

    function startVoting() {
      gameState = 'voting';
      document.getElementById('btnVoteStart').disabled = true;
      document.getElementById('btnVoteStart').textContent = 'Oylama başladı!';
      document.getElementById('votingArea').classList.remove('hidden');
      const opts = document.getElementById('voteOptions');
      opts.innerHTML = '';
      Object.entries(players).forEach(([id, p]) => {
        if (id === myId) return;
        const btn = document.createElement('button');
        btn.textContent = p.name;
        btn.onclick = () => castVote(id);
        opts.appendChild(btn);
      });
    }

    function castVote(targetId) {
      if (myVote) return;
      myVote = targetId;
      broadcast('vote_cast', { targetId });
      document.querySelectorAll('#voteOptions button').forEach(b => b.disabled = true);
    }

    function handleVoteCast(payload) {
      votes[payload.from] = payload.targetId;
      if (Object.keys(votes).length >= Object.keys(players).length) revealResult();
    }

    function revealResult() {
      gameState = 'result';
      const tally = {};
      Object.values(votes).forEach(tid => { tally[tid] = (tally[tid] || 0) + 1; });
      let max = 0, winner = null;
      Object.entries(tally).forEach(([id, c]) => { if (c > max) { max = c; winner = id; } });

      const resultArea = document.getElementById('resultArea');
      resultArea.classList.remove('hidden');
      if (winner === spyId) {
        resultArea.innerHTML = `<div class="result-box win">Casus doğru bulundu!<br><span class="small">${players[spyId]?.name || 'Casus'} yakalandı.</span></div>`;
      } else {
        resultArea.innerHTML = `<div class="result-box lose">Kaybettiniz!<br><span class="small">Casus: ${players[spyId]?.name || 'Bilinmiyor'}</span></div>`;
      }
      document.getElementById('btnNewRound').classList.remove('hidden');
      document.getElementById('btnNewRound').disabled = !isHost;
    }

    function setMode(m) {
      mode = m;
      document.getElementById('modeSpy').classList.toggle('active', m === 'spy');
      document.getElementById('modeAuc').classList.toggle('active', m === 'auction');
    }
    document.getElementById('modeSpy').onclick = () => setMode('spy');
    document.getElementById('modeAuc').onclick = () => setMode('auction');
    document.getElementById('btnCreate').onclick = async () => {
      myName = document.getElementById('playerName').value.trim();
      if (!myName) { alert('Korsan adını yaz!'); return; }
      document.getElementById('lobbyStatus').textContent = 'Oda oluşturuluyor...';
      await joinRoom(generateRoomCode(), true);
    };
    document.getElementById('btnJoinCode').onclick = async () => {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) { alert('Oda kodu girin'); return; }
      document.getElementById('lobbyStatus').textContent = 'Katılıyor...';
      await joinRoom(code, false);
    };
    document.getElementById('btnLeave').onclick = async () => {
      if (gameChannel) await gameChannel.unsubscribe();
      if (isHost && lobbyChannel) await lobbyChannel.track({ id: myId, name: myName, isHost: false });
      gameChannel = null; players = {}; isHost = false; roomCode = ''; AS = null; gameState = 'lobby';
      show('lobby');
    };
    document.getElementById('btnStart').onclick = () => {
      if (!isHost) return;
      if (mode === 'auction') { auStart(); return; }
      // Güncel presence'tan oyuncu listesini al (önbellekteki players'a güvenme)
      const live = [];
      Object.values(gameChannel.presenceState()).forEach(arr => arr.forEach(p => { if (!live.includes(p.id)) live.push(p.id); }));
      const ids = live.length ? live : Object.keys(players);
      if (ids.length < 3 || ids.length > 8) return;
      const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
      const character = CHARACTERS[rnd(CHARACTERS.length)];
      const spyIdChosen = ids[rnd(ids.length)];
      console.log('Casus adayları:', ids, '-> seçilen:', spyIdChosen, '| kurucu:', myId);
      const infos = CHARACTER_DATA[character];
      const generalInfo = infos[Math.floor(Math.random() * infos.length)];
      broadcast('game_start', { character, spyId: spyIdChosen, generalInfo });
    };
    document.getElementById('btnVoteStart').onclick = () => {
      if (gameState !== 'game') return;
      broadcast('vote_start_press', {});
    };
    document.getElementById('btnNewRound').onclick = () => {
      if (!isHost) return;
      broadcast('new_round', {});
    };

    // ========== NAKAMA MÜZAYEDESİ ==========
    const auRnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
    function auShuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = auRnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    const auEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function auGive(p, c, price, why) {
      AS.team[p].push(c); AS.money[p] -= price; AS.i++;
      AS.log.unshift(`${AS.names[p]} → ${c} (${price}$)${why ? ' · ' + why : ''}`);
    }
    function auNext() {
      while (true) {
        if ((AS.team[0].length >= 5 && AS.team[1].length >= 5) || AS.i >= AS.deck.length) { AS.phase = 'end'; return; }
        const c = AS.deck[AS.i], full = AS.team.map(t => t.length >= 5), z = AS.money.map(m => m === 0);
        if (full[0] || full[1]) { auGive(full[0] ? 1 : 0, c, 0, 'kadro dolu, bedava'); continue; }
        if (z[0] && z[1]) { auGive(AS.opener, c, 0, 'iki taraf da parasız, sırayla'); AS.opener ^= 1; continue; }
        if (z[0] || z[1]) { AS.phase = 'choose'; AS.chooser = z[0] ? 1 : 0; return; }
        AS.phase = 'bid'; AS.bid = null; AS.turn = AS.opener; return;
      }
    }
    function auResolve() { auGive(AS.bid.by, AS.deck[AS.i], AS.bid.amount); AS.opener ^= 1; auNext(); }
    function auNewGame(ids, names) {
      AS = { phase: 'bid', ids, names, money: [20, 20], team: [[], []], deck: auShuffle(CHARACTERS).slice(0, 10), i: 0, opener: auRnd(2), bid: null, turn: 0, chooser: null, log: [] };
      auNext(); auPush();
    }
    function auStart() {
      const live = [];
      Object.values(gameChannel.presenceState()).forEach(arr => arr.forEach(p => { if (!live.some(x => x.id === p.id)) live.push(p); }));
      const other = live.find(p => p.id !== myId);
      if (!other) return;
      auNewGame([myId, other.id], [myName, other.name]);
    }
    function auApply(p, a) {
      if (!AS) return;
      if (a.t === 'bid' && AS.phase === 'bid' && AS.turn === p) {
        const x = parseInt(a.v, 10);
        if (!(x > (AS.bid ? AS.bid.amount : 0) && x <= AS.money[p])) return;
        AS.bid = { amount: x, by: p }; AS.log.unshift(`${AS.names[p]} teklif: ${x}$`);
        if (AS.money[p ^ 1] <= x) auResolve(); else AS.turn = p ^ 1;
      } else if (a.t === 'pass' && AS.phase === 'bid' && AS.turn === p && AS.bid) {
        auResolve();
      } else if (a.t === 'choose' && AS.phase === 'choose' && AS.chooser === p) {
        auGive(a.take ? p : p ^ 1, AS.deck[AS.i], 0, 'seçim'); AS.opener ^= 1; auNext();
      } else return;
      auPush();
    }
    function auPush() { broadcast('au_state', { AS }); auRender(); }
    function auAct(a) { if (isHost) auApply(0, a); else broadcast('au_act', { a }); }

    function auRender() {
      if (!AS) return;
      gameState = 'auction'; show('auction');
      const me = AS.ids.indexOf(myId), v = document.getElementById('auView');
      let h = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div><strong>Oda:</strong> <span style="color:var(--straw); font-size:1.35rem; font-family:'Pirata One',cursive;">${roomCode}</span></div>
        <button id="auLeave" class="secondary" style="width:auto; padding:7px 12px; font-size:0.85rem; margin:0;">Ayrıl</button></div>`;
      h += '<div class="au-sides">';
      for (let p = 0; p < 2; p++) {
        const active = (AS.phase === 'bid' && AS.turn === p) || (AS.phase === 'choose' && AS.chooser === p);
        h += `<div class="au-side ${p === me ? 'me' : ''} ${active ? 'turn' : ''}"><h3>${auEsc(AS.names[p])}${p === me ? ' (Sen)' : ''}</h3><div class="au-money">${AS.money[p]}$</div>`;
        for (let k = 0; k < 5; k++) { const c = AS.team[p][k]; h += `<div class="au-slot ${c ? 'f' : ''}">${c ? auEsc(c) : '—'}</div>`; }
        h += '</div>';
      }
      h += '</div>';
      if (AS.phase === 'end') {
        h += '<div class="au-char">Draft bitti!</div><p class="au-mid">Kadrolara bakın, kim daha güçlü?</p>';
        if (isHost) h += '<button id="auAgain">Yeni Oyun</button>';
      } else {
        h += `<div class="au-mid">Karakter ${AS.i + 1} / ${AS.deck.length}</div><div class="au-char">${auEsc(AS.deck[AS.i])}</div>`;
        if (AS.phase === 'bid') {
          const cur = AS.bid ? AS.bid.amount : 0;
          h += `<p class="au-mid">${AS.bid ? `Son teklif: <b>${cur}$</b> (${auEsc(AS.names[AS.bid.by])})` : `Açılış: ${auEsc(AS.names[AS.opener])} en az 1$ vermek zorunda`}</p>`;
          if (AS.turn === me) {
            h += `<input id="auAmt" type="number" min="${cur + 1}" max="${AS.money[me]}" value="${cur + 1}" style="margin-top:8px;"><div class="au-row"><button id="auBid">Teklif Ver</button>${AS.bid ? '<button id="auPass" class="secondary">Artırmıyorum</button>' : ''}</div>`;
          } else h += `<p class="au-mid" style="margin-top:8px;">${auEsc(AS.names[AS.turn])} düşünüyor...</p>`;
        } else if (AS.phase === 'choose') {
          h += `<p class="au-mid">${auEsc(AS.names[AS.chooser ^ 1])}'in parası bitti. ${auEsc(AS.names[AS.chooser])} karar veriyor (bedava).</p>`;
          if (AS.chooser === me) h += '<div class="au-row" style="margin-top:8px;"><button id="auTake">Ben alayım</button><button id="auGive" class="secondary">Sen al</button></div>';
        }
      }
      h += '<div class="au-log">' + AS.log.map(l => `<div>${auEsc(l)}</div>`).join('') + '</div>';
      v.innerHTML = h;
      const g = id => document.getElementById(id);
      g('auLeave').onclick = () => document.getElementById('btnLeave').onclick();
      if (g('auBid')) g('auBid').onclick = () => auAct({ t: 'bid', v: g('auAmt').value });
      if (g('auPass')) g('auPass').onclick = () => auAct({ t: 'pass' });
      if (g('auTake')) g('auTake').onclick = () => auAct({ t: 'choose', take: true });
      if (g('auGive')) g('auGive').onclick = () => auAct({ t: 'choose', take: false });
      if (g('auAgain')) g('auAgain').onclick = () => auNewGame(AS.ids, AS.names);
    }

    initLobby();

    // ========== BACKGROUND MUSIC ==========
    const bgMusic = document.getElementById('bgMusic');
    const btnMute = document.getElementById('btnMute');
    const volumeSlider = document.getElementById('volume-slider');
    let isMuted = false;
    let savedVolume = 0.35;

    bgMusic.volume = 0.35;

    // Auto-play attempt (browsers often block until user interaction)
    function tryPlayMusic() {
      bgMusic.play().catch(() => {
        // Autoplay blocked – will start on first click
      });
    }
    tryPlayMusic();

    // Start music on first user interaction if blocked
    document.body.addEventListener('click', function startMusicOnce() {
      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
      document.body.removeEventListener('click', startMusicOnce);
    }, { once: true });

    btnMute.onclick = (e) => {
      e.stopPropagation();
      if (isMuted) {
        bgMusic.volume = savedVolume;
        volumeSlider.value = savedVolume;
        btnMute.textContent = '🔊';
        isMuted = false;
        if (bgMusic.paused) bgMusic.play().catch(() => {});
      } else {
        savedVolume = bgMusic.volume;
        bgMusic.volume = 0;
        volumeSlider.value = 0;
        btnMute.textContent = '🔇';
        isMuted = true;
      }
    };

    volumeSlider.oninput = () => {
      const vol = parseFloat(volumeSlider.value);
      bgMusic.volume = vol;
      savedVolume = vol;
      isMuted = vol === 0;
      btnMute.textContent = vol === 0 ? '🔇' : '🔊';
      if (vol > 0 && bgMusic.paused) bgMusic.play().catch(() => {});
    };
  </script>
</body>
</html>
